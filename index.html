const idb=new Promise((res,rej)=>{if(!window.indexedDB)return rej();const r=indexedDB.open('cpbox',2);r.onupgradeneeded=()=>{const d=r.result;if(!d.objectStoreNames.contains('m'))d.createObjectStore('m',{keyPath:'id'});if(!d.objectStoreNames.contains('x'))d.createObjectStore('x',{keyPath:'id'})};r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)});

 const buf=await file.slice(0,Math.min(size+10,8*1048576)).arrayBuffer(),u=new Uint8Array(buf),d=new DataView(buf),r={};let o=10;

  const id=String.fromCharCode(u[o],u[o+1],u[o+2],u[o+3]);if(!/^[A-Z0-9]{4}$/.test(id))break;
  const fs=v===4?((u[o+4]<<21)|(u[o+5]<<14)|(u[o+6]<<7)|u[o+7]):d.getUint32(o+4);
  if(!fs||o+10+fs>u.length)break;const fr=u.subarray(o+10,o+10+fs);
  if(id==='TIT2')r.title=txt(fr);else if(id==='TPE1')r.artist=txt(fr);else if(id==='TALB')r.album=txt(fr);
  else if(id==='APIC'&&!r.cover){for(let i=0;i<fr.length-3;i++){
   if(fr[i]===0xFF&&fr[i+1]===0xD8&&fr[i+2]===0xFF){r.cover=new Blob([fr.subarray(i)],{type:'image/jpeg'});break}
   if(fr[i]===0x89&&fr[i+1]===0x50&&fr[i+2]===0x4E&&fr[i+3]===0x47){r.cover=new Blob([fr.subarray(i)],{type:'image/png'});break}}}
  o+=10+fs;}

const vthumb=file=>new Promise(res=>{const v=document.createElement('video'),u=URL.createObjectURL(file);let done=0;
 const end=b=>{if(done)return;done=1;URL.revokeObjectURL(u);v.removeAttribute('src');res(b)};setTimeout(()=>end(null),9000);
 v.muted=true;v.preload='metadata';v.src=u;v.onloadedmetadata=()=>{v.currentTime=Math.min(3,(v.duration||0)/3)};
 v.onseeked=()=>{try{const c=document.createElement('canvas');c.width=360;c.height=Math.round(360*(v.videoHeight||9)/(v.videoWidth||16));c.getContext('2d').drawImage(v,0,0,c.width,c.height);c.toBlob(b=>end(b),'image/jpeg',.8)}catch(e){end(null)}};

async function enrich(t){try{let m={};
 if(t.type==='audio'){if(/\.mp3$/i.test(t.file.name))m=await id3(t.file)||{}}else m={cover:await vthumb(t.file)};
 if(m.title)t.title=m.title;if(m.artist)t.artist=m.artist;if(m.album)t.album=m.album;
 if(m.cover){t.coverBlob=m.cover;t.cover=URL.createObjectURL(m.cover);t.color=await colorOf(m.cover)}

function mk(f,o){const s=(f._rel||f.webkitRelativePath||'').split('/'),folder=s.length>1?s[s.length-2]:'';
 const base=f.name.replace(/\.[^.]+$/,'').replace(/[_ ]?\d{3,4}x\d{3,4}$/,'').replace(/_/g,' ').trim();let artist='',title=base;const k=base.indexOf(' - ');
 if(k>0){const l=base.slice(0,k).trim(),r=base.slice(k+3).trim();if(/^\d+$/.test(l))title=r;else{artist=l;title=r}}
 return {id:f.name+'|'+f.size+'|'+f.lastModified,type:kind(f),file:f,size:f.size,order:o,title,artist,album:'',folder,url:URL.createObjectURL(f),cover:'',coverBlob:null,color:''}}
async function addFiles(list){
 const fs=[...list].filter(kind);if(!fs.length)return toast('Nenhum áudio ou vídeo compatível.');
 const key=f=>f._rel||f.webkitRelativePath||f.name;fs.sort((a,b)=>key(a).localeCompare(key(b),undefined,{numeric:true}));
 const nu=[];for(const f of fs){const t=mk(f,order++);if(IDX[t.id]!==undefined){URL.revokeObjectURL(t.url);continue}IDX[t.id]=T.length;T.push(t);nu.push(t)}
 if(!nu.length)return toast('Esses arquivos já estão na biblioteca.');
 toast(nu.length+' arquivos adicionados.');render(true);
 if(navigator.storage&&navigator.storage.persist)navigator.storage.persist();
 for(const t of nu)if(t.size<=CAP)dbPut(t);
 if(nu.some(t=>t.size>CAP))toast('Arquivos acima de 250 MB tocam agora, mas não ficam salvos.');
 enrichAll(nu)}
async function pickDir(){try{const h=await showDirectoryPicker(),out=[];
 const walk=async(d,p)=>{for await(const [n,e] of d.entries()){if(n[0]==='.')continue;if(e.kind==='file'){const f=await e.getFile();if(kind(f)){f._rel=p+n;out.push(f)}}else await walk(e,p+n+'/')}};
 await walk(h,h.name+'/');addFiles(out)}catch(e){}}

  IDX[t.id]=T.length;T.push(t);order=Math.max(order,t.order+1)}
