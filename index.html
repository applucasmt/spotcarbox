<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#000000">
<meta name="mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<title>CarBox Music</title>
<style>
:root{--ac:#1DB954;--ac-hover:#1ed760;--bg:#000;--card:rgba(24,24,26,.95);--card-solid:#18181a;--sep:rgba(255,255,255,.08);--t2:rgba(235,235,245,.6);--fill:rgba(120,120,128,.2);--fg:#fff;--nav-bg:#121212}
body.light{--bg:#f2f2f7;--card:rgba(255,255,255,.95);--card-solid:#fff;--sep:rgba(0,0,0,.08);--t2:rgba(60,60,67,.6);--fill:rgba(120,120,128,.15);--fg:#000;--nav-bg:#fff}
*{margin:0;padding:0;box-sizing:border-box;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display",Inter,"Segoe UI",Roboto,sans-serif;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent;user-select:none}
html{font-size:clamp(10px,min(3.3vh,2.1vw),17px)}
html,body{width:100%;height:100%;background:var(--bg);color:var(--fg);overflow:hidden;overscroll-behavior:none}
::-webkit-scrollbar{display:none}
button{border:0;background:none;color:inherit;cursor:pointer;font-size:inherit;outline:none}
button:focus-visible{outline:2px solid var(--ac)}
svg{display:block;flex-shrink:0;fill:currentColor}
.hidden{display:none!important}

#app{position:fixed;inset:0;background:radial-gradient(90% 70% at 15% 0%,rgba(29,185,84,.12),transparent 60%),var(--bg);z-index:1}
#body{position:absolute;inset:0 0 5.4rem 0;display:flex;padding:.5rem .5rem 0;gap:.5rem}
#nav{width:11rem;background:var(--card);border-radius:1rem;padding:.5rem;flex-shrink:0;display:flex;flex-direction:column;gap:.2rem;overflow-y:auto;z-index:10}
.ni{display:flex;align-items:center;width:100%;height:3.2rem;padding:0 .8rem;color:var(--t2);font-size:.95rem;font-weight:600;border-radius:.6rem;text-align:left;white-space:nowrap;transition:background .2s,color .2s}
.ni svg{margin-right:.8rem;width:1.5rem;height:1.5rem}.ni.on{background:var(--fill);color:var(--fg)}.ni.on svg{color:var(--ac)}.ni:hover{color:var(--fg)}.ni:active{background:var(--fill)}.ni.fs{margin-top:auto}
#main{flex:1;min-width:0;background:var(--card);border-radius:1rem;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:1.5rem 1.5rem 2rem}
h1{font-size:2.2rem;font-weight:700;letter-spacing:-.04em;margin-bottom:1.2rem;line-height:1.1}
h2{font-size:1.3rem;font-weight:700;letter-spacing:-.02em;margin:1.8rem 0 .9rem}
.cv{background-size:cover;background-position:center;background-repeat:no-repeat;border-radius:.6rem;display:flex;align-items:center;justify-content:center;flex-shrink:0;color:rgba(255,255,255,.5);overflow:hidden;box-shadow:0 .2rem .8rem rgba(0,0,0,.4)}
.t1{font-size:1rem;font-weight:600;letter-spacing:-.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.t2{font-size:.85rem;color:var(--t2);margin-top:.2rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:.8rem}
.tile{display:flex;align-items:center;background:var(--fill);border-radius:.8rem;overflow:hidden;height:4rem;font-weight:600;font-size:.95rem;min-width:0;transition:background .2s}
.tile:hover{background:rgba(120,120,128,.3)}.tile .cv{border-radius:0;box-shadow:none}.tile span{padding:0 1rem;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.hs{display:flex;gap:1.2rem;overflow-x:auto;-webkit-overflow-scrolling:touch;margin:0 -1.5rem;padding:0 1.5rem}
.card{width:9rem;flex-shrink:0;min-width:0;cursor:pointer;transition:transform .2s}.card:hover{transform:scale(1.02)}.card .cv{border-radius:.8rem}.card .t1{margin-top:.6rem}
.row{display:flex;align-items:center;min-height:4.4rem;padding:.2rem .8rem;border-radius:.6rem;gap:1rem;cursor:pointer;transition:background .2s}
.row:hover{background:var(--fill)}.rt{flex:1;min-width:0}.row.on .t1{color:var(--ac)}
.hb{width:3.2rem;height:3.2rem;color:var(--t2);display:flex;align-items:center;justify-content:center;flex-shrink:0;border-radius:50%;transition:color .2s}.hb:hover{color:var(--fg)}.hb.on{color:var(--ac)}
.chips{display:flex;gap:.6rem;margin-bottom:1.2rem;overflow-x:auto}.chip{background:var(--fill);border-radius:2rem;padding:.6rem 1.2rem;font-size:.9rem;font-weight:600;white-space:nowrap;cursor:pointer;transition:all .2s}.chip:hover{background:rgba(120,120,128,.3)}.chip.on{background:var(--fg);color:var(--bg)}
.hd{display:flex;align-items:flex-end;gap:1.5rem;padding:.5rem 0 1.5rem}.hd .cv{border-radius:1rem;box-shadow:0 .8rem 2rem rgba(0,0,0,.5)}
.hd .k{font-size:.75rem;font-weight:700;letter-spacing:.1em;color:var(--t2)}.hd .big{font-size:2.4rem;font-weight:700;letter-spacing:-.04em;line-height:1.05;margin:.3rem 0;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.acts{display:flex;align-items:center;gap:.8rem;margin-bottom:1.2rem;flex-wrap:wrap}
.pbig{width:4rem;height:4rem;border-radius:50%;background:var(--ac);color:#000;display:flex;align-items:center;justify-content:center;box-shadow:0 .4rem 1.2rem rgba(29,185,84,.3);transition:transform .1s}.pbig:hover{transform:scale(1.04);background:var(--ac-hover)}.pbig:active{transform:scale(.96)}
.ib{width:3.2rem;height:3.2rem;display:flex;align-items:center;justify-content:center;color:var(--t2);flex-shrink:0;border-radius:50%;transition:color .2s}.ib:hover{color:var(--fg)}.ib.on{color:var(--ac)}
.btn{display:inline-flex;align-items:center;gap:.5rem;background:var(--fg);color:var(--bg);border-radius:2rem;padding:.8rem 1.4rem;font-weight:600;font-size:.95rem;transition:opacity .2s}.btn:hover{opacity:.9}.btn svg{width:1.2rem;height:1.2rem}
.btn2{background:var(--fill);border-radius:2rem;padding:.8rem 1.4rem;font-size:.95rem;font-weight:600;cursor:pointer;color:var(--fg);transition:background .2s}.btn2:hover{background:rgba(120,120,128,.3)}
#q{width:100%;height:3.2rem;border-radius:.8rem;border:0;background:var(--fill);color:var(--fg);font-size:1rem;padding:0 1.2rem;margin-bottom:1.2rem;user-select:text;outline:none;transition:background .2s}#q:focus{background:rgba(120,120,128,.3)}#q::placeholder{color:var(--t2)}
.empty{text-align:center;color:var(--t2);padding:3rem 1rem;font-size:1.1rem;line-height:1.5}.empty .acts{justify-content:center;margin-top:1.5rem}
.tip{font-size:.85rem;color:var(--t2);max-width:32rem;margin:1rem auto 0;line-height:1.5}

/* BARRA DE REPRODUÇÃO - Z-INDEX ALTO PARA FICAR ACIMA DE TUDO */
#bar{position:absolute;left:.5rem;right:.5rem;bottom:.5rem;height:4.4rem;border-radius:1rem;background:rgba(40,40,42,.85);backdrop-filter:blur(24px) saturate(180%);-webkit-backdrop-filter:blur(24px) saturate(180%);display:flex;align-items:center;padding:0 .8rem;gap:.2rem;overflow:hidden;box-shadow:0 .4rem 1.2rem rgba(0,0,0,.4),inset 0 0 0 1px rgba(255,255,255,.05);color:#fff;z-index:50}
body.light #bar{background:rgba(240,240,245,.9);color:#000;box-shadow:0 .4rem 1.2rem rgba(0,0,0,.1),inset 0 0 0 1px rgba(0,0,0,.05)}
#bpb,#bp{position:absolute;left:0;bottom:0;height:.2rem}#bpb{right:0;background:rgba(120,120,128,.2)}#bp{background:var(--ac);width:0;transition:width .1s}
#bi{flex:1;min-width:0;display:flex;align-items:center;gap:.8rem;cursor:pointer;padding:.2rem;border-radius:.6rem}
#bi:hover{background:rgba(120,120,128,.1)}
.ci{width:3.4rem;height:3.4rem;display:flex;align-items:center;justify-content:center;color:inherit;border-radius:50%;flex-shrink:0;transition:background .2s}.ci:hover{background:rgba(120,120,128,.2)}
.pl{width:3.8rem;height:3.8rem;background:var(--fg);color:var(--bg)}#bar .pl{background:none;color:inherit}.ic-pa{display:none}body.playing .ic-pa{display:block}body.playing .ic-pl{display:none}

/* TELA TOCANDO AGORA */
#np{position:fixed;inset:0;z-index:60;background:var(--bg);transform:translateY(100%);transition:transform .4s cubic-bezier(.2,.8,.2,1);display:flex;align-items:center;justify-content:center;padding:0 4rem;gap:4rem;color:var(--fg)}
#np.open{transform:none}
#npbg{position:absolute;inset:-4rem;z-index:-1;filter:blur(3rem) saturate(1.5);pointer-events:none}
#npdown{position:absolute;top:1rem;left:1rem;width:3.4rem;height:3.4rem;border-radius:50%;background:rgba(120,120,128,.2);color:inherit;z-index:3;display:flex;align-items:center;justify-content:center;transition:background .2s}#npdown:hover{background:rgba(120,120,128,.4)}
#npart{width:min(70vh,40vw);height:min(70vh,40vw);flex-shrink:0;position:relative;border-radius:1.2rem;overflow:hidden;box-shadow:0 2rem 4rem rgba(0,0,0,.5);background:#222;touch-action:pan-y}
#npcov{position:absolute;inset:0;background-size:cover;background-position:center;display:flex;align-items:center;justify-content:center;color:rgba(255,255,255,.3);pointer-events:none}
#vid,#vidB{position:absolute;inset:0;width:100%;height:100%;background:#000;object-fit:contain;opacity:0;transition:opacity .3s;pointer-events:none}
#vid.show,#vidB.show{opacity:1}
#npr{flex:1;min-width:0;max-width:32rem;position:relative;z-index:2}.nph{display:flex;align-items:center;gap:1rem}
#nt{font-size:1.8rem;font-weight:700;line-height:1.15;letter-spacing:-.03em;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
#na{font-size:1.2rem;color:var(--t2);margin-top:.4rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pr{margin:1.5rem 0 1.2rem}#seek{display:block;width:100%;height:1.5rem;-webkit-appearance:none;appearance:none;background:transparent;cursor:pointer}
#seek::-webkit-slider-runnable-track{height:.3rem;border-radius:.2rem;background:linear-gradient(90deg,var(--fg) var(--p,0%),rgba(120,120,128,.3) var(--p,0%))}
#seek::-webkit-slider-thumb{-webkit-appearance:none;width:1.1rem;height:1.1rem;border-radius:50%;background:var(--fg);margin-top:-.4rem;box-shadow:0 .1rem .4rem rgba(0,0,0,.4);transition:transform .1s}#seek::-webkit-slider-thumb:hover{transform:scale(1.2)}
.tms{display:flex;justify-content:space-between;font-size:.75rem;color:var(--t2);font-variant-numeric:tabular-nums;margin-top:.2rem}
.ctl{display:flex;align-items:center;justify-content:center;gap:clamp(.5rem,2vw,1.5rem)}.ctl .ci{width:4rem;height:4rem}.ctl .pl{width:5rem;height:5rem}
#np.vmode{padding:0;background:#000;display:block}#np.vmode #npbg{display:none}
#np.vmode #npart{position:absolute;inset:0;width:auto;height:auto;border-radius:0;box-shadow:none}
#np.vmode #npr{display:contents}
#np.vmode .nph{position:absolute;top:0;left:0;right:0;z-index:2;padding:1rem 2rem 3rem 5rem;background:linear-gradient(rgba(0,0,0,.8),transparent);color:#fff}
#np.vmode .npb{position:absolute;left:0;right:0;bottom:0;z-index:2;padding:3rem 2rem 1rem;background:linear-gradient(transparent,rgba(0,0,0,.9));color:#fff}
#np.vmode #nt{font-size:1.2rem;-webkit-line-clamp:1}#np.vmode #na{font-size:.9rem;margin-top:.2rem}
.nph,.npb,#npdown{transition:opacity .3s}#np.vmode.hideui .nph,#np.vmode.hideui .npb,#np.vmode.hideui #npdown{opacity:0;pointer-events:none}

#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:6.5rem;text-align:center;z-index:99;pointer-events:none;opacity:0;transition:opacity .3s,transform .3s}
#toast span{display:inline-block;background:#333;color:#fff;font-weight:600;padding:.8rem 1.5rem;border-radius:2rem;font-size:.95rem;box-shadow:0 .4rem 1.5rem rgba(0,0,0,.4)}#toast.show{opacity:1;transform:translateX(-50%) translateY(-.5rem)}
.lyr{max-height:16rem;overflow-y:auto;margin:1.2rem 0;padding:.8rem 1rem;background:var(--fill);border-radius:.8rem;font-size:1rem;line-height:1.6;color:var(--t2);text-align:center;scroll-behavior:smooth}
.lyr .cur{color:var(--fg);font-weight:700;font-size:1.1rem;text-shadow:0 0 1rem rgba(255,255,255,.2)}
.lyr .past{opacity:.4}
.panel{background:var(--fill);border-radius:1rem;padding:1.2rem 1.5rem;margin-bottom:1.2rem}
.panel label{display:flex;align-items:center;justify-content:space-between;font-size:.95rem;font-weight:600;margin:.8rem 0;gap:1rem}
.panel input[type=range]{flex:1;max-width:16rem;accent-color:var(--ac)}
.panel select{background:var(--card-solid);color:var(--fg);border:1px solid var(--sep);border-radius:.5rem;padding:.5rem .8rem;font-size:.95rem;outline:none}
.panel .rowline{display:flex;gap:.8rem;flex-wrap:wrap;align-items:center;margin:.8rem 0}
.small{font-size:.8rem;color:var(--t2);line-height:1.5}
#viz{width:100%;height:5rem;display:block;margin:.8rem 0;border-radius:.5rem}
@media (max-aspect-ratio:1/1){
 #body{flex-direction:column}#nav{width:auto;flex-direction:row;overflow-x:auto;padding:.4rem}.ni{width:auto;padding:0 .8rem;height:2.8rem}.ni svg{margin-right:.5rem}.ni.fs{margin:0 0 0 auto}
 #np:not(.vmode){flex-direction:column;justify-content:center;padding:4rem 1.5rem 1.5rem;gap:1.5rem}#npart{width:min(70vw,40vh);height:min(70vw,40vh)}#npr{width:100%;flex:none}
}
</style>
</head>
<body>
<input type="file" id="fi" multiple class="hidden" accept="audio/*,video/*,.mp3,.m4a,.aac,.wav,.flac,.ogg,.oga,.opus,.mp4,.m4v,.mkv,.webm,.mov,.3gp,.m3u,.m3u8,.pls">
<input type="file" id="fd" multiple webkitdirectory class="hidden">
<input type="file" id="fcover" accept="image/*" class="hidden">
<input type="file" id="flrc" accept=".lrc,text/plain" class="hidden">

<div id="app">
 <div id="body">
  <div id="nav" role="navigation">
   <button class="ni" id="n-home" onclick="go('home')"></button>
   <button class="ni" id="n-search" onclick="go('search')"></button>
   <button class="ni" id="n-lib" onclick="go('lib')"></button>
   <button class="ni" id="n-play" onclick="go('playlists')"></button>
   <button class="ni" id="n-local" onclick="go('local')"></button>
   <button class="ni" id="n-stats" onclick="go('stats')"></button>
   <button class="ni" id="n-set" onclick="openSettings()"></button>
   <button class="ni fs" id="n-fs" onclick="toggleFS()"></button>
  </div>
  <div id="main" role="main"></div>
 </div>
 <div id="bar" class="hidden">
  <div id="bpb"></div><div id="bp"></div>
  <div id="bi" onclick="openNP()"><div id="bc"></div><div style="min-width:0"><div class="t1" id="bt"></div><div class="t2" id="ba"></div></div></div>
  <button class="ci" id="bh" onclick="like(-1)"></button>
  <button class="ci" onclick="prev()" id="bprev"></button>
  <button class="ci pl" onclick="toggle()"><span class="ic-pl" id="bpl"></span><span class="ic-pa" id="bpa"></span></button>
  <button class="ci" onclick="next()" id="bnext"></button>
 </div>
</div>

<div id="np" role="dialog">
 <div id="npbg"></div>
 <button id="npdown" onclick="closeNP()"></button>
 <div id="npart" onclick="tapVideo()"><div id="npcov"></div><video id="vid" playsinline></video><video id="vidB" playsinline></video></div>
 <div id="npr">
  <div class="nph"><div style="min-width:0;flex:1"><div id="nt"></div><div id="na"></div></div><button class="ib" id="nh" onclick="like(-1)"></button></div>
  <div class="npb">
   <div class="lyr" id="lyr" style="display:none"></div>
   <div class="pr"><input type="range" id="seek" min="0" max="100" value="0" step="any"><div class="tms"><span id="tc">0:00</span><span id="td">0:00</span></div></div>
   <div class="ctl">
    <button class="ib" id="nsh" onclick="toggleShuffle()"></button>
    <button class="ci" onclick="prev()" id="nprev"></button>
    <button class="ci pl" onclick="toggle()"><span class="ic-pl" id="npl"></span><span class="ic-pa" id="npa"></span></button>
    <button class="ci" onclick="next()" id="nnext"></button>
    <button class="ib" id="nrp" onclick="toggleRepeat()"></button>
   </div>
   <div class="ctl" style="margin-top:.8rem;gap:.5rem">
    <button class="ib" onclick="cycleRate()" id="nrate" style="width:auto;padding:0 .8rem;font-size:.9rem;font-weight:700">1x</button>
    <button class="ib" onclick="toggleAudioProc()" id="nproc" style="width:auto;padding:0 .8rem;font-size:.85rem;font-weight:700">EQ off</button>
    <button class="ib" onclick="openSleepMenu()" id="nsleep" style="width:auto;padding:0 .8rem;font-size:.85rem;font-weight:700">Sleep</button>
    <button class="ib" onclick="togglePiP()" id="npip" style="display:none"></button>
   </div>
  </div>
 </div>
</div>
<div id="toast"><span id="tmsg"></span></div>

const ICONS = {

  lib: '<path d="M208,24H48A16,16,0,0,0,32,40V216a16,16,0,0,0,16,16H208a16,16,0,0,0,16-16V40A16,16,0,0,0,208,24ZM48,40H80V216H48ZM208,216H96V40H208Z"/><rect x="120" y="60" width="56" height="8" rx="4"/><rect x="120" y="92" width="56" height="8" rx="4"/><rect x="120" y="124" width="56" height="8" rx="4"/>',
  play: '<path d="M228.23,134.69,84.15,222.81A16,16,0,0,1,60,209.12V46.88a16,16,0,0,1,24.15-13.69L228.23,121.31A16,16,0,0,1,228.23,134.69Z"/>',
  pause: '<path d="M200,32H160a16,16,0,0,0-16,16V208a16,16,0,0,0,16,16h40a16,16,0,0,0,16-16V48A16,16,0,0,0,200,32Zm0,176H160V48h40ZM96,32H56A16,16,0,0,0,40,48V208a16,16,0,0,0,16,16H96a16,16,0,0,0,16-16V48A16,16,0,0,0,96,32Zm0,176H56V48H96Z"/>',
  prev: '<path d="M232,64V192a16,16,0,0,1-24.53,13.26L104,144.31V192a8,8,0,0,1-16,0V64a8,8,0,0,1,16,0v47.69l103.47-60.95A16,16,0,0,1,232,64Z"/><rect x="24" y="56" width="8" height="144" rx="4"/>',

  for(const f of fs) {

    IDX[t.id] = T.length; T.push(t); nu.push(t);

  if(!nu.length) return toast('Já estão na biblioteca.');
  toast(nu.length + ' adicionados.');
  render(true);

  for(const t of nu) if(t.size <= CAP) dbPut(t);

}
async function pickDir() {
  try {
    const h = await showDirectoryPicker(), out = [];
    const walk = async(d, p) => {
      for await(const [n, e] of d.entries()) {
        if(n[0] === '.') continue;
        if(e.kind === 'file') {
          const f = await e.getFile(), k = kind(f);
          if(k === 'audio' || k === 'video' || k === 'lrc') { f._rel = p+n; out.push(f); }
        } else await walk(e, p+n+'/');
      }
    };
    await walk(h, h.name+'/');
    const lrcs = out.filter(f => kind(f) === 'lrc'), media = out.filter(f => { const k = kind(f); return k === 'audio' || k === 'video'; });
    await addFiles(media);
    for(const lf of lrcs) {
      const base = lf._rel.replace(/\.lrc$/i,'');
      const mt = media.find(m => { const k = (m._rel || m.name).replace(/\.[^.]+$/,''); return k === base || k.endsWith('/'+base.split('/').pop()); });
      if(mt) {
        const t = T.find(x => x.file.name === mt.name);
        if(t) { const text = await lf.text(); lrcCache[t.id] = parseLrc(text); dbDo('readwrite', s => s.lrc.put({id:t.id, text})).catch(()=>{}); }
      }

}

function parseM3U(text) { const out = []; text.split(/\r?\n/).forEach(ln => { const s = ln.trim(); if(!s || s[0] === '#') return; out.push({name:s.split(/[\\/]/).pop(), path:s}); }); return out; }
function parsePLS(text) { const out = []; text.split(/\r?\n/).forEach(ln => { const m = ln.match(/^File\d+=(.+)$/i); if(m) out.push({name:m[1].split(/[\\/]/).pop(), path:m[1]}); }); return out; }
async function handlePlaylistFile(file) {

  if(!entries.length) return toast('Playlist vazia.');
  const names = entries.map(e => e.name);
  const apply = async files => {
    const map = {}; files.forEach(f => map[f.name.toLowerCase()] = f);
    const matched = []; names.forEach(n => { const f = map[n.toLowerCase()]; if(f) matched.push(f); });
    if(!matched.length) return toast('Nenhum arquivo encontrado.');
    const before = T.length; await addFiles(matched); const added = T.length - before;
    const plIdx = T.map((t,i) => i).filter(i => matched.some(f => f.name === T[i].file.name));
    const pl = {id:'pl_'+Date.now(), name:file.name.replace(/\.(m3u8?|pls)$/i,''), idx:plIdx, created:Date.now()};

  };
  const existing = names.map(n => T.find(t => t.file.name.toLowerCase() === n.toLowerCase())).filter(Boolean);
  if(existing.length === names.length) return apply(existing.map(t => t.file));
  toast('Selecione os arquivos da playlist.');
  $('fi').onchange = async e => { const fs = [...e.target.files]; e.target.value = ''; $('fi').onchange = origFiChange; await apply(fs); };

}

function start(skipFade) {
  const t = cur(); if(!t) return;
  if(!skipFade && cfg.crossfade > 0 && activeVid.src && !activeVid.paused && activeVid.currentTime > 1) {
    const dur = cfg.crossfade;
    nextVid.src = t.url; nextVid.currentTime = 0; nextVid.volume = 0;
    nextVid.play().then(() => {
      const steps = 30; let i = 0; clearInterval(fadeTimer);
      fadeTimer = setInterval(() => {
        i++; const p = Math.min(1, i/steps);
        nextVid.volume = p; activeVid.volume = 1-p;
        if(i >= steps) {
          clearInterval(fadeTimer);
          activeVid.pause(); activeVid.removeAttribute('src'); activeVid.load();
          const tmp = activeVid; activeVid = nextVid; nextVid = tmp;
          activeVid.className = 'show'; nextVid.className = '';
          attachHandlers(activeVid); attachHandlers(nextVid);
        }
      }, dur*1000/steps);
    });
  } else {
    activeVid.src = t.url; activeVid.volume = 1;
    const p = activeVid.play(); if(p && p.catch) p.catch(() => toast('Toque em play.'));
    activeVid.className = 'show'; nextVid.className = '';
  }
  recents = [t.id, ...recents.filter(x => x !== t.id)].slice(0, 12); sv('recents', recents); sv('last', t.id);
  stats.plays[t.id] = (stats.plays[t.id]||0) + 1; sv('stats', stats);
  upd(); render(true);
  if(t.type === 'video') openNP();
  loadLrcFor(t).then(lines => { lrcCache[t.id] = lines; renderLrc(lines, activeVid.currentTime); });
  if(t.type === 'video' && 'pictureInPictureEnabled' in document && document.pictureInPictureEnabled) $('npip').style.display = '';
  else $('npip').style.display = 'none';
}
function toggle() { if(!cur()) return; if(!activeVid.getAttribute('src')) return start(); activeVid.paused ? activeVid.play() : activeVid.pause(); }
function next() { const n = Q.length; if(!n) return; if(shuffle && n > 1) { let k = qi; while(k === qi) k = Math.floor(Math.random()*n); qi = k; } else qi = (qi+1)%n; start(); }
function prev() { if(!Q.length) return; if(activeVid.currentTime > 3) { activeVid.currentTime = 0; return; } qi = qi === 0 ? Q.length-1 : qi-1; start(); }
function toggleShuffle() { shuffle = !shuffle; $('nsh').style.color = shuffle ? '#1DB954' : ''; $('nsh').classList.toggle('on', shuffle); }
function toggleRepeat() { repeat = (repeat+1)%3; $('nrp').style.color = repeat ? '#1DB954' : ''; $('nrp').classList.toggle('on', !!repeat); toast(['Repetir: desligado','Repetir: tudo','Repetir: uma faixa'][repeat]); }
function like(i) { const t = i < 0 ? cur() : T[i]; if(!t) return; likes[t.id] ? delete likes[t.id] : likes[t.id] = 1; sv('likes', likes); upd(); render(true); }
function cycleRate() { const rates = [0.5,0.75,1,1.25,1.5,1.75,2]; const i = rates.indexOf(activeVid.playbackRate); const r = rates[(i+1)%rates.length]; activeVid.playbackRate = r; vidB.playbackRate = r; $('nrate').textContent = r+'x'; }
function playColl() { if(!coll.idx.length) return; Q = coll.idx.slice(); qi = shuffle ? Math.floor(Math.random()*Q.length) : 0; start(); }
function playAt(i) { Q = CTX.slice(); qi = Q.indexOf(i); start(); }
function playOne(i) { Q = T.map((_,k) => k); qi = i; start(); }

// ===== Audio Proc =====
let actx = null, src = null, srcB = null, chain = null, vizOn = false;
function applyEq() {
  if(!chain) return;
  const presets = {off:[0,0,0], bass:[8,0,-2], vocal:[-2,4,2], rock:[5,2,4], pop:[2,3,-1], jazz:[3,2,1]};
  const p = presets[cfg.eq] || [0,0,0];
  chain.bass.gain.value = p[0] + cfg.eqBass; chain.mid.gain.value = p[1] + cfg.eqMid; chain.treble.gain.value = p[2] + cfg.eqTreble;
}
async function toggleAudioProc() {
  if(cfg.proc) {
    try { if(actx) await actx.close(); } catch(e) {}
    actx = null; src = null; srcB = null; chain = null;
    cfg.proc = false; saveCfg(); $('nproc').textContent = 'EQ off'; toast('Processamento desligado.'); return;
  }
  try {
    actx = new (window.AudioContext||window.webkitAudioContext)();
    if(actx.state === 'suspended') await actx.resume();
    src = actx.createMediaElementSource(activeVid); srcB = actx.createMediaElementSource(nextVid);
    const comp = actx.createDynamicsCompressor();
    const bass = actx.createBiquadFilter(); bass.type = 'lowshelf'; bass.frequency.value = 200;
    const mid = actx.createBiquadFilter(); mid.type = 'peaking'; mid.frequency.value = 1000; mid.Q.value = 0.7;
    const treble = actx.createBiquadFilter(); treble.type = 'highshelf'; treble.frequency.value = 6000;
    const gain = actx.createGain(); gain.gain.value = 1;
    const analyser = actx.createAnalyser(); analyser.fftSize = 256;
    comp.connect(bass); bass.connect(mid); mid.connect(treble); treble.connect(gain); gain.connect(analyser); analyser.connect(actx.destination);
    chain = {comp,bass,mid,treble,gain,analyser};
    applyEq();
    src.connect(chain.comp); srcB.connect(chain.comp);
    cfg.proc = true; saveCfg(); $('nproc').textContent = 'EQ on'; toast('Processamento de áudio ligado.');
  } catch(e) { toast('Falha no processamento.'); cfg.proc = false; saveCfg(); }
}
function startViz() {
  if(!chain || !chain.analyser) return;
  const cvs = document.createElement('canvas'); cvs.id = 'viz';
  $('npr').insertBefore(cvs, $('npr').querySelector('.npb')); vizOn = true;
  const an = chain.analyser, ctx = cvs.getContext('2d'), buf = new Uint8Array(an.frequencyBinCount);
  function draw() {
    if(!vizOn) { cvs.remove(); return; }
    an.getByteFrequencyData(buf); ctx.clearRect(0,0,cvs.width,cvs.height);
    const w = cvs.width/buf.length*2;
    for(let i=0;i<buf.length;i++) { const v = buf[i]/255; ctx.fillStyle = 'rgba(29,185,84,'+v+')'; ctx.fillRect(i*w, cvs.height*(1-v), w-1, cvs.height*v); }
    requestAnimationFrame(draw);
  }
  cvs.width = cvs.clientWidth*devicePixelRatio; cvs.height = cvs.clientHeight*devicePixelRatio; draw();
}

// ===== Vídeo Eventos =====
function vidOnPlay() { sync(); showUI(); }
function vidOnPause() { sync(); showUI(); }
function vidOnEnded() {
  sync();
  if(repeat === 2) { activeVid.currentTime = 0; activeVid.play(); return; }
  if(repeat === 0 && !shuffle && qi === Q.length-1) return;
  next();
}
function vidOnError() { const t = cur(); if(!t || !activeVid.getAttribute('src')) return; toast('Erro: '+t.title); if(Q.length > 1) setTimeout(next, 1500); }
function vidOnTime() {
  const d = activeVid.duration||0, c = activeVid.currentTime;
  $('tc').textContent = fmt(c); $('td').textContent = fmt(d); $('bp').style.width = (d ? c/d*100 : 0)+'%';
  if(!seeking) { sk.max = d; sk.value = c; }
  sk.style.setProperty('--p', (d ? c/d*100 : 0)+'%');
  const t = cur();
  if(t && !activeVid.paused) { const now = Date.now(); const dt = (now-(vidOnTime._last||now))/1000; if(dt>0 && dt<2) stats.time[t.id] = (stats.time[t.id]||0)+dt; vidOnTime._last = now; }
  const lines = lrcCache[t?t.id:0]; if(lines) renderLrc(lines, c);
}
function attachHandlers(el) { el.onplay = vidOnPlay; el.onpause = vidOnPause; el.onended = vidOnEnded; el.onerror = vidOnError; el.ontimeupdate = vidOnTime; }
attachHandlers(activeVid); attachHandlers(nextVid);
const sk = $('seek');
sk.oninput = () => { seeking = true; activeVid.currentTime = parseFloat(sk.value); sk.style.setProperty('--p', (sk.value/(sk.max||1)*100)+'%'); };
sk.onchange = sk.ontouchend = sk.onmouseup = () => { seeking = false; };

// ===== Tela NP =====
let ut;
function showUI() { const n = $('np'); n.classList.remove('hideui'); clearTimeout(ut); if(n.classList.contains('vmode') && !activeVid.paused) ut = setTimeout(() => n.classList.add('hideui'), 3500); }
function tapVideo() { const n = $('np'); if(!n.classList.contains('vmode')) return; if(n.classList.contains('hideui')) showUI(); else { clearTimeout(ut); n.classList.add('hideui'); } }
$('np').addEventListener('pointerdown', () => { if(!$('np').classList.contains('hideui')) showUI(); });
function openNP() { if(!cur()) return; $('np').classList.add('open'); showUI(); }
function closeNP() { $('np').classList.remove('open'); }
function upd() {
  const t = cur(); if(!t) return;
  $('bar').className = '';
  $('bc').innerHTML = cov(t, 3.2); $('bt').textContent = t.title; $('ba').textContent = artistOf(t); $('nt').textContent = t.title; $('na').textContent = artistOf(t);
  const lk = !!likes[t.id];
  $('bh').innerHTML = ic(lk?'heart':'heartO','1.6rem'); $('nh').innerHTML = ic(lk?'heart':'heartO','1.8rem');
  $('bh').style.color = lk?'#1DB954':''; $('nh').style.color = lk?'#1DB954':'';
  const isv = t.type === 'video', n = $('np');
  n.classList.toggle('vmode', isv);
  if(!isv) n.classList.remove('hideui');
  $('npcov').style.display = isv ? 'none' : 'flex';
  $('npcov').style.backgroundImage = t.cover ? `url('${t.cover}')` : 'none';
  $('npcov').style.backgroundColor = t.cover ? '' : '#222';
  $('npcov').innerHTML = t.cover ? '' : ic('note','8rem');
  $('npbg').style.background = t.cover ? `linear-gradient(rgba(0,0,0,.4),rgba(0,0,0,.6)),url('${t.cover}') center/cover` : `linear-gradient(180deg,${t.color||'#333'},#000)`;
  if('mediaSession' in navigator && window.MediaMetadata) navigator.mediaSession.metadata = new MediaMetadata({title:t.title, artist:artistOf(t), album:albumOf(t), artwork:t.cover ? [{src:t.cover, sizes:'360x360'}] : []});
  $('nrate').textContent = activeVid.playbackRate+'x'; $('nproc').textContent = cfg.proc ? 'EQ on' : 'EQ off';
  $('nsleep').textContent = sleepTimer ? 'Sleep '+Math.ceil((sleepTarget-Date.now())/60000)+'m' : 'Sleep';
}
async function wake() { try { if(!navigator.wakeLock) return; if(!activeVid.paused && !wl) { wl = await navigator.wakeLock.request('screen'); wl.onrelease = () => wl = null; } else if(activeVid.paused && wl) { await wl.release(); wl = null; } } catch(e) {} }
function sync() { document.body.className = (theme==='light'?'light ':'') + ((!activeVid.paused && !activeVid.ended) ? 'playing' : ''); if('mediaSession' in navigator) navigator.mediaSession.playbackState = activeVid.paused ? 'paused' : 'playing'; wake(); }

// ===== Ajustes / Recorder =====
function openSettings() {
  const m = $('main');
  let h = '<h1>Ajustes</h1>';
  h += '<div class="panel"><div class="small">Reprodução</div>'
    + `<label>Crossfade (s) <input type="range" min="0" max="10" step="1" value="${cfg.crossfade}" oninput="cfg.crossfade=+this.value;saveCfg();this.nextElementSibling.textContent=this.value+'s'"><span>${cfg.crossfade}s</span></label>`
    + `<label>EQ preset <select onchange="cfg.eq=this.value;saveCfg();applyEq()">${['off','bass','vocal','rock','pop','jazz'].map(p=>`<option value="${p}"${cfg.eq===p?' selected':''}>${p}</option>`).join('')}</select></label>`
    + `<label>Bass <input type="range" min="-12" max="12" value="${cfg.eqBass}" oninput="cfg.eqBass=+this.value;saveCfg();applyEq()"></label>`
    + `<label>Mid <input type="range" min="-12" max="12" value="${cfg.eqMid}" oninput="cfg.eqMid=+this.value;saveCfg();applyEq()"></label>`
    + `<label>Treble <input type="range" min="-12" max="12" value="${cfg.eqTreble}" oninput="cfg.eqTreble=+this.value;saveCfg();applyEq()"></label>`
    + '<div class="rowline"><button class="btn2" onclick="toggleAudioProc()">'+(cfg.proc?'Desligar proc.':'Ligar proc.')+'</button><button class="btn2" onclick="startViz()">Visualizador</button></div></div>';
  h += '<div class="panel"><div class="small">Aparência</div><div class="rowline"><button class="btn2" onclick="theme=\'dark\';sv(\'theme\',theme);applyTheme();render();sync()">Escuro</button><button class="btn2" onclick="theme=\'light\';sv(\'theme\',theme);applyTheme();render();sync()">Claro</button></div></div>';
  h += '<div class="panel"><div class="small">Biblioteca</div><div class="rowline"><button class="btn2" onclick="exportLib()">Exportar JSON</button><button class="btn2" onclick="importLib()">Importar JSON</button><button class="btn2" onclick="openRecorder()">Gravador</button></div></div>';
  h += '<div class="panel"><div class="small">Dados</div><button class="btn2" onclick="clearLib()">Limpar biblioteca</button></div>';
  m.innerHTML = h;
  ['home','search','lib','play','local','stats'].forEach(n => $('n-'+n) && ($('n-'+n).className = 'ni'));
}
function openRecorder() { const m = $('main'); m.innerHTML = '<h1>Gravador</h1><div class="panel"><div class="rowline"><button class="btn" id="recStart" onclick="toggleRec()">Iniciar</button><span id="recT" class="small"></span></div></div>'; }
let rec = null, recChunks = [], recT0 = 0, recIv = null;
async function toggleRec() {
  if(rec) { rec.stop(); return; }
  try {
    const stream = await navigator.mediaDevices.getUserMedia({audio:true}); rec = new MediaRecorder(stream); recChunks = []; recT0 = Date.now();
    rec.ondataavailable = e => { if(e.data.size) recChunks.push(e.data); };
    rec.onstop = async () => {
      stream.getTracks().forEach(t => t.stop()); clearInterval(recIv);
      const blob = new Blob(recChunks, {type:recChunks[0]?.type||'audio/webm'}); const name = 'Nota '+new Date().toLocaleString('pt-BR').replace(/[/:]/g,'-')+'.webm';
      const file = new File([blob], name, {type:blob.type}); rec = null; $('recStart').textContent = 'Iniciar';
      await addFiles([file]); toast('Salvo.'); go('local');
    };
    rec.start(); $('recStart').textContent = 'Parar';
    recIv = setInterval(() => { const s = Math.floor((Date.now()-recT0)/1000); $('recT').textContent = fmt(s); }, 500);
  } catch(e) { toast('Microfone indisponível.'); }
}

// ===== Sleep / PiP =====
function openSleepMenu() {
  const m = prompt('Sleep (min, 0=cancelar):'); if(m === null) return; const min = parseInt(m)||0;
  clearTimeout(sleepTimer); sleepTimer = null;
  if(!min) { toast('Cancelado.'); return; }
  sleepTarget = Date.now() + min*60000;
  sleepTimer = setTimeout(() => { activeVid.pause(); toast('Sleep: pausado.'); $('nsleep').textContent = 'Sleep'; }, min*60000);
  $('nsleep').textContent = 'Sleep '+min+'m'; toast('Sleep: '+min+'m.');
}
function togglePiP() {
  if(!document.pictureInPictureEnabled) return toast('PiP indisponível.');
  try { if(document.pictureInPictureElement) document.exitPictureInPicture(); else activeVid.requestPictureInPicture(); } catch(e) { toast('PiP indisponível.'); }
}

// ===== Gestos =====
(function() {
  const np = $('np'); let sx = 0, sy = 0, active = false;
  np.addEventListener('pointerdown', e => { if(!np.classList.contains('open') || np.classList.contains('vmode')) return; active = true; sx = e.clientX; sy = e.clientY; });
  np.addEventListener('pointerup', e => {
    if(!active) return; active = false;
    const dx = e.clientX-sx, dy = e.clientY-sy;
    if(Math.abs(dy) > 80 && dy > 0 && Math.abs(dy) > Math.abs(dx)) closeNP();
    else if(Math.abs(dx) > 80 && Math.abs(dx) > Math.abs(dy)) dx > 0 ? prev() : next();
  });
  np.addEventListener('pointercancel', () => { active = false; });
})();

// ===== Tela cheia / MediaSession =====
const toggleFS = () => { if(document.fullscreenElement) document.exitFullscreen(); else document.documentElement.requestFullscreen({navigationUI:'hide'}).catch(() => toast('Tela cheia indisponível.')); };
if(android && !matchMedia('(display-mode: fullscreen), (display-mode: standalone)').matches) {
  document.addEventListener('click', () => { if(!document.fullscreenElement) document.documentElement.requestFullscreen({navigationUI:'hide'}).catch(()=>{}); }, {once:true});
}
addEventListener('keydown', e => { if(e.key === 'MediaTrackNext') next(); else if(e.key === 'MediaTrackPrevious') prev(); else if(e.key === 'MediaPlayPause') toggle(); else if(e.key === 'Escape') closeNP(); });
history.pushState({}, ''); addEventListener('popstate', () => { history.pushState({}, ''); if($('np').classList.contains('open')) closeNP(); else if(view === 'coll') { view = prevView; coll = null; render(); } });
if('mediaSession' in navigator) {
  const a = (n, f) => { try { navigator.mediaSession.setActionHandler(n, f); } catch(e) {} };
  a('play', () => activeVid.play()); a('pause', () => activeVid.pause()); a('previoustrack', prev); a('nexttrack', next); a('seekto', d => { if(d.seekTime != null) activeVid.currentTime = d.seekTime; });
}

// ===== Abrir com =====
if('launchQueue' in window && 'files' in LaunchParams.prototype) {
  launchQueue.setConsumer(async p => { if(!p.files || !p.files.length) return; try { const fs = await Promise.all(p.files.map(h => h.getFile())); addFiles(fs); } catch(e) { toast('Falha ao abrir arquivo.'); } });
}

$('n-search').innerHTML = ic('search','1.6rem')+'Buscar';
$('n-lib').innerHTML = ic('lib','1.6rem')+'Biblioteca';
$('n-play').innerHTML = ic('list','1.6rem')+'Playlists';
$('n-local').innerHTML = ic('folder','1.6rem')+'Arquivos locais';
$('n-stats').innerHTML = ic('stat','1.6rem')+'Estatísticas';
$('n-set').innerHTML = ic('gear','1.6rem')+'Ajustes';
$('n-fs').innerHTML = ic('fs','1.6rem')+'Tela cheia';
$('bprev').innerHTML = ic('prev','2rem');
$('bnext').innerHTML = ic('next','2rem');
$('nprev').innerHTML = ic('prev','2.4rem');
$('nnext').innerHTML = ic('next','2.4rem');
$('bpl').innerHTML = ic('play','2.2rem'); $('bpa').innerHTML = ic('pause','2.2rem');
$('npl').innerHTML = ic('play','2.8rem'); $('npa').innerHTML = ic('pause','2.8rem');
$('nsh').innerHTML = ic('shuf','1.8rem'); $('nrp').innerHTML = ic('rep','1.8rem');
$('npdown').innerHTML = ic('down','2.4rem');

render();
restore();
if('serviceWorker' in navigator) addEventListener('load', () => navigator.serviceWorker.register('./sw.js').catch(()=>{}));
</script>
