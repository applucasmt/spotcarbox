const txt=fr=>{const e=fr[0],b=fr.subarray(1),l=e===0?'windows-1252':e===1?'utf-16':e===2?'utf-16be':'utf-8';try{return new TextDecoder(l).decode(b).replace(/\0+$/,'').replace(/^\uFEFF/,'').trim()}catch(x){return ''}};
async function id3(file){const h=new Uint8Array(await file.slice(0,10).arrayBuffer());
 if(h[0]!==0x49||h[1]!==0x44||h[2]!==0x33||h[3]<3)return null;
 const v=h[3],size=(h[6]<<21)|(h[7]<<14)|(h[8]<<7)|h[9];
 const buf=await file.slice(0,Math.min(size+10,8*1048576)).arrayBuffer(),u=new Uint8Array(buf),d=new DataView(buf),r={};let o=10;
 while(o+10<=u.length&&o<size+10){const id=String.fromCharCode(u[o],u[o+1],u[o+2],u[o+3]);if(!/^[A-Z0-9]{4}$/.test(id))break;
  const fs=v===4?((u[o+4]<<21)|(u[o+5]<<14)|(u[o+6]<<7)|u[o+7]):d.getUint32(o+4);
  if(!fs||o+10+fs>u.length)break;const fr=u.subarray(o+10,o+10+fs);
  if(id==='TIT2')r.title=txt(fr);else if(id==='TPE1')r.artist=txt(fr);else if(id==='TALB')r.album=txt(fr);
  else if(id==='USLT'){const enc=fr[0];const lang=String.fromCharCode(fr[1],fr[2],fr[3]);let i=4;while(i<fr.length&&fr[i]!==0)i++;const desc=fr.subarray(4,i);const body=fr.subarray(i+1);try{r.lyrics=new TextDecoder(enc===1?'utf-16':enc===2?'utf-16be':enc===0?'windows-1252':'utf-8').decode(body)}catch(e){}}
  else if(id==='APIC'&&!r.cover){for(let i=0;i<fr.length-3;i++){
   if(fr[i]===0xFF&&fr[i+1]===0xD8&&fr[i+2]===0xFF){r.cover=new Blob([fr.subarray(i)],{type:'image/jpeg'});break}
   if(fr[i]===0x89&&fr[i+1]===0x50&&fr[i+2]===0x4E&&fr[i+3]===0x47){r.cover=new Blob([fr.subarray(i)],{type:'image/png'});break}}}
  o+=10+fs;}
 return r;}
const vthumb=file=>new Promise(res=>{const v=document.createElement('video'),u=URL.createObjectURL(file);let done=0;
 const end=b=>{if(done)return;done=1;URL.revokeObjectURL(u);v.removeAttribute('src');res(b)};setTimeout(()=>end(null),9000);
 v.muted=true;v.preload='metadata';v.src=u;v.onloadedmetadata=()=>{v.currentTime=Math.min(3,(v.duration||0)/3)};
 v.onseeked=()=>{try{const c=document.createElement('canvas');c.width=360;c.height=Math.round(360*(v.videoHeight||9)/(v.videoWidth||16));c.getContext('2d').drawImage(v,0,0,c.width,c.height);c.toBlob(b=>end(b),'image/jpeg',.8)}catch(e){end(null)}};

function mk(f,o){const s=(f._rel||f.webkitRelativePath||'').split('/'),folder=s.length>1?s[s.length-2]:'';
 const base=f.name.replace(/\.[^.]+$/,'').replace(/[_ ]?\d{3,4}x\d{3,4}$/,'').replace(/_/g,' ').trim();let artist='',title=base;const k=base.indexOf(' - ');
 if(k>0){const l=base.slice(0,k).trim(),r=base.slice(k+3).trim();if(/^\d+$/.test(l))title=r;else{artist=l;title=r}}
 return {id:f.name+'|'+f.size+'|'+f.lastModified,type:kind(f),file:f,size:f.size,order:o,title,artist,album:'',folder,url:URL.createObjectURL(f),cover:'',coverBlob:null,color:''}}

 const key=f=>f._rel||f.webkitRelativePath||f.name;fs.sort((a,b)=>key(a).localeCompare(key(b),undefined,{numeric:true}));
 const nu=[];for(const f of fs){const t=mk(f,order++);if(IDX[t.id]!==undefined){URL.revokeObjectURL(t.url);continue}IDX[t.id]=T.length;T.push(t);nu.push(t)}

// ===== Web Audio (EQ, analyser, compressor) =====
let actx=null,src=null,srcB=null,chain=null,vizOn=false;
function buildChain(){
 if(!actx)return;
 const comp=actx.createDynamicsCompressor();
 const bass=actx.createBiquadFilter();bass.type='lowshelf';bass.frequency.value=200;
 const mid=actx.createBiquadFilter();mid.type='peaking';mid.frequency.value=1000;mid.Q.value=0.7;
 const treble=actx.createBiquadFilter();treble.type='highshelf';treble.frequency.value=6000;
 const gain=actx.createGain();gain.gain.value=1;
 const analyser=actx.createAnalyser();analyser.fftSize=256;
 comp.connect(bass);bass.connect(mid);mid.connect(treble);treble.connect(gain);gain.connect(analyser);analyser.connect(actx.destination);
 chain={comp,bass,mid,treble,gain,analyser};
 applyEq();
}
function applyEq(){
 if(!chain)return;
 const presets={off:[0,0,0],bass:[8,0,-2],vocal:[-2,4,2],rock:[5,2,4],pop:[2,3,-1],jazz:[3,2,1]};
 const p=presets[cfg.eq]||[0,0,0];
 chain.bass.gain.value=p[0]+cfg.eqBass;chain.mid.gain.value=p[1]+cfg.eqMid;chain.treble.gain.value=p[2]+cfg.eqTreble;
}
async function toggleAudioProc(){
 if(cfg.proc){
  try{if(actx){await actx.close()}}catch(e){}
  actx=null;src=null;srcB=null;chain=null;
  cfg.proc=false;saveCfg();$('nproc').textContent='EQ off';
  toast('Processamento desligado. Recarregue a faixa para aplicar.');return}
 try{
  actx=new (window.AudioContext||window.webkitAudioContext)();
  if(actx.state==='suspended')await actx.resume();
  src=actx.createMediaElementSource(activeVid);srcB=actx.createMediaElementSource(nextVid);
  buildChain();
  src.connect(chain.comp);srcB.connect(chain.comp);
  cfg.proc=true;saveCfg();$('nproc').textContent='EQ on';
  toast('Processamento de áudio ligado (volume nativo desativado).');
 }catch(e){toast('Não foi possível ativar o processamento.');cfg.proc=false;saveCfg()}}
function startViz(){if(!chain||!chain.analyser)return;const cvs=document.createElement('canvas');cvs.id='viz';$('npr').insertBefore(cvs,$('npr').querySelector('.npb'));vizOn=true;
 const an=chain.analyser,ctx=cvs.getContext('2d'),buf=new Uint8Array(an.frequencyBinCount);
 function draw(){if(!vizOn){cvs.remove();return}an.getByteFrequencyData(buf);ctx.clearRect(0,0,cvs.width,cvs.height);
  const w=cvs.width/buf.length*2;for(let i=0;i<buf.length;i++){const v=buf[i]/255;ctx.fillStyle='rgba(29,185,84,'+v+')';ctx.fillRect(i*w,cvs.height*(1-v),w-1,cvs.height*v)}
  requestAnimationFrame(draw)}

function openSettings(){const m=$('main');
 let h='<h1>Ajustes</h1>';
 h+='<div class="panel"><div class="small">Reprodução</div>'+
  `<label>Crossfade (s) <input type="range" min="0" max="10" step="1" value="${cfg.crossfade}" oninput="cfg.crossfade=+this.value;saveCfg();this.nextElementSibling.textContent=this.value+'s'"><span>${cfg.crossfade}s</span></label>`+
  `<label>EQ preset <select onchange="cfg.eq=this.value;saveCfg();applyEq()">${['off','bass','vocal','rock','pop','jazz'].map(p=>`<option value="${p}"${cfg.eq===p?' selected':''}>${p}</option>`).join('')}</select></label>`+
  `<label>Bass <input type="range" min="-12" max="12" value="${cfg.eqBass}" oninput="cfg.eqBass=+this.value;saveCfg();applyEq()"></label>`+
  `<label>Mid <input type="range" min="-12" max="12" value="${cfg.eqMid}" oninput="cfg.eqMid=+this.value;saveCfg();applyEq()"></label>`+
  `<label>Treble <input type="range" min="-12" max="12" value="${cfg.eqTreble}" oninput="cfg.eqTreble=+this.value;saveCfg();applyEq()"></label>`+
  '<div class="rowline"><button class="btn2" onclick="toggleAudioProc()">'+(cfg.proc?'Desligar processamento':'Ligar processamento')+'</button><button class="btn2" onclick="startViz()">Visualizador</button></div></div>';
 h+='<div class="panel"><div class="small">Aparência</div><div class="rowline"><button class="btn2" onclick="theme=\'dark\';sv(\'theme\',theme);applyTheme();render();sync()">Escuro</button><button class="btn2" onclick="theme=\'light\';sv(\'theme\',theme);applyTheme();render();sync()">Claro</button></div></div>';
 h+='<div class="panel"><div class="small">Biblioteca</div><div class="rowline"><button class="btn2" onclick="exportLib()">Exportar JSON</button><button class="btn2" onclick="importLib()">Importar JSON</button><button class="btn2" onclick="openRecorder()">Gravador de voz</button></div></div>';
 h+='<div class="panel"><div class="small">Dados locais</div><button class="btn2" onclick="clearLib()">Limpar biblioteca</button></div>';
 m.innerHTML=h;['home','search','lib','play','local','stats'].forEach(n=>$('n-'+n)&&($('n-'+n).className='ni'))}
function openRecorder(){
 const m=$('main');m.innerHTML='<h1>Gravador de voz</h1><div class="panel"><div class="small">Toque em iniciar para gravar uma nota de voz. Ao parar, ela entra na biblioteca.</div><div class="rowline"><button class="btn" id="recStart" onclick="toggleRec()">Iniciar gravação</button><span id="recT" class="small"></span></div></div><div id="recList"></div>';
}
let rec=null,recChunks=[],recT0=0,recIv=null;
async function toggleRec(){
 if(rec){rec.stop();return}
 try{const stream=await navigator.mediaDevices.getUserMedia({audio:true});rec=new MediaRecorder(stream);recChunks=[];recT0=Date.now();
  rec.ondataavailable=e=>{if(e.data.size)recChunks.push(e.data)};
  rec.onstop=async()=>{stream.getTracks().forEach(t=>t.stop());clearInterval(recIv);
   const blob=new Blob(recChunks,{type:recChunks[0]?.type||'audio/webm'});const name='Nota '+new Date().toLocaleString('pt-BR').replace(/[/:]/g,'-')+'.webm';
   const file=new File([blob],name,{type:blob.type});rec=null;$('recStart').textContent='Iniciar gravação';
   await addFiles([file]);toast('Nota salva.');go('local')};
  rec.start();$('recStart').textContent='Parar gravação';
  recIv=setInterval(()=>{const s=Math.floor((Date.now()-recT0)/1000);$('recT').textContent=fmt(s)},500)
 }catch(e){toast('Microfone indisponível.')}}

// ===== Tela cheia =====
const toggleFS=()=>{if(document.fullscreenElement)document.exitFullscreen();else document.documentElement.requestFullscreen({navigationUI:'hide'}).catch(()=>toast('Tela cheia indisponível.'))};
if(android&&!matchMedia('(display-mode: fullscreen), (display-mode: standalone)').matches)
 document.addEventListener('click',()=>{if(!document.fullscreenElement)document.documentElement.requestFullscreen({navigationUI:'hide'}).catch(()=>{})},{once:true});
addEventListener('keydown',e=>{if(e.key==='MediaTrackNext')next();else if(e.key==='MediaTrackPrevious')prev();else if(e.key==='MediaPlayPause')toggle();else if(e.key==='Escape')closeNP()});
history.pushState({},'');addEventListener('popstate',()=>{history.pushState({},'');if($('np').classList.contains('open'))closeNP();else if(view==='coll'){view=prevView;coll=null;render()}});

// ===== Abrir via "Abrir com" =====
if('launchQueue' in window&&'files' in LaunchParams.prototype){
 launchQueue.setConsumer(async p=>{if(!p.files||!p.files.length)return;
  try{const fs=await Promise.all(p.files.map(h=>h.getFile()));addFiles(fs)}catch(e){toast('Não foi possível abrir o arquivo.')}});}

// ===== Boot =====
$('n-home').innerHTML=ic('home','1.6rem')+'Início';$('n-search').innerHTML=ic('search','1.6rem')+'Buscar';$('n-lib').innerHTML=ic('lib','1.6rem')+'Biblioteca';
$('n-play').innerHTML=ic('list','1.6rem')+'Playlists';$('n-local').innerHTML=ic('folder','1.6rem')+'Arquivos locais';$('n-stats').innerHTML=ic('stat','1.6rem')+'Estatísticas';$('n-fs').innerHTML=ic('fs','1.6rem')+'Tela cheia';
$('bprev').innerHTML=ic('prev','1.8rem');$('bnext').innerHTML=ic('next','1.8rem');$('nprev').innerHTML=ic('prev','2.2rem');$('nnext').innerHTML=ic('next','2.2rem');
$('bpl').innerHTML=ic('play','2rem');$('bpa').innerHTML=ic('pause','2rem');$('npl').innerHTML=ic('play','2.5rem');$('npa').innerHTML=ic('pause','2.5rem');
$('nsh').innerHTML=ic('shuf','1.6rem');$('nrp').innerHTML=ic('rep','1.6rem');$('npdown').innerHTML=ic('down','2.4rem');$('npip').innerHTML=ic('pip','1.6rem');

// botão de ajustes fixo
const nav=$('nav');const stBtn=document.createElement('button');stBtn.className='ni';stBtn.innerHTML=ic('eq','1.6rem')+'Ajustes';stBtn.onclick=openSettings;nav.insertBefore(stBtn,$('n-fs'));

render();restore();
if('serviceWorker' in navigator)addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));
</script></body></html>
